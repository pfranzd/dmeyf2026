# Un solo fold (train 202104 -> valid 202106, gap 2) con features temporales de 1 solo mes de
# retroceso, para que 202104 no tenga NULL en lags/deltas (el panel empieza en 202103).
# Features: originales + lag_1 + delta_1 + deltapct_1. Se excluyen lag_2/delta_2 (e012_excluir.txt),
# ventanas/tendencia de 3 meses, historia y el resto de las derivadas (mismo criterio que e011).
# El modelo final entrenaria con 202104-202106 (3 meses) aunque Optuna tunea con 1 mes de train:
# num_iterations / min_data_in_leaf no se reescalan por cantidad de meses. Compararlo contra
# meses_final: [202106] antes de elegirlo para una entrega.
# Reusa la cache de features (fe_hash 30197667f3db): no reconstruye.
hereda: ../base.yaml
experimento: e012_fold_unico_1mes

periodos:
  n_folds: 1
  n_meses_train: 1
  meses_final: [202104, 202105, 202106]

dataset:
  excluir_bloques: [1a_tc_consolidado, 1b_tc_fechas, 1c_ratios_dominio, 1d_agregados, 1e_flags_riesgo, 2_rank_intrames, 5_ventanas, 6_tendencia, 7_historia]
  excluir_features: ["archivo:competencia_1/configs/exp/e012_excluir.txt"]

optuna:
  n_trials: 80
  espacio:
    learning_rate: {tipo: float, low: 0.001, high: 0.05, log: true}
    feature_fraction: {tipo: float, low: 0.02, high: 0.5, log: true}
    num_leaves: {tipo: int, low: 8, high: 256, log: true}
    min_data_in_leaf: {tipo: int, low: 1, high: 2000, log: true}
    num_iterations: {tipo: int, low: 200, high: 4096, log: false}

estabilidad:
  top_k: 5
  n_semillas: 5

final:
  params_desde: estable:auto

etapas:
  optuna: true
  estabilidad: true
  validacion: true
  final: false
  salida: false
