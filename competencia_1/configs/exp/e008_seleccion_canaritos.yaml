    top50_por_ganancia: {solo_bloques: null, excluir_bloques: [8_canaritos], excluir_features: [Master_Finiciomora, Visa_Finiciomora, Master_fultimo_cierre, Visa_fultimo_cierre, tc_finiciomora_menor, tc_fultimo_cierre_menor, 'archivo:work/competencia_1/runs/20261004-223642_e007_canaritos/excluir_fuera_top50.txt']}
    top100_por_ganancia: {solo_bloques: null, excluir_bloques: [8_canaritos], excluir_features: [Master_Finiciomora, Visa_Finiciomora, Master_fultimo_cierre, Visa_fultimo_cierre, tc_finiciomora_menor, tc_fultimo_cierre_menor, 'archivo:work/competencia_1/runs/20261004-223642_e007_canaritos/excluir_fuera_top100.txt']}
    top200_por_ganancia: {solo_bloques: null, excluir_bloques: [8_canaritos], excluir_features: [Master_Finiciomora, Visa_Finiciomora, Master_fultimo_cierre, Visa_fultimo_cierre, tc_finiciomora_menor, tc_fultimo_cierre_menor, 'archivo:work/competencia_1/runs/20261004-223642_e007_canaritos/excluir_fuera_top200.txt']}
    top350_por_ganancia: {solo_bloques: null, excluir_bloques: [8_canaritos], excluir_features: [Master_Finiciomora, Visa_Finiciomora, Master_fultimo_cierre, Visa_fultimo_cierre, tc_finiciomora_menor, tc_fultimo_cierre_menor, 'archivo:work/competencia_1/runs/20261004-223642_e007_canaritos/excluir_fuera_top350.txt']}

