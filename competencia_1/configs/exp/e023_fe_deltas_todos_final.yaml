# Paso 2 de 2 de e022: modelo final al estilo e019 (el mejor en el publico): 3 meses
# (202104-202106) y min_data_in_leaf x3 por la cantidad de meses (el pipeline luego lo
# multiplica x10 por el undersampling). Params en e023_params.json, generado desde el
# __estable.json de e022. Reusa la cache de features de e022 (mismo fe -> mismo fe_hash).
hereda: e022_fe_deltas_todos.yaml
experimento: e023_fe_deltas_todos_final

periodos:
  meses_final: [202104, 202105, 202106]

final:
  params_desde: archivo:competencia_1/configs/exp/e023_params.json
  n_semillas: 20

salida:
  envios: [10000, 11000]

etapas:
  optuna: false
  estabilidad: false
  validacion: false
  final: true
  salida: true
